<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아이패드 구매 채팅 시안</title>
<link rel="stylesheet" href="../lib/design-system.css">
<script src="../lib/vendor/lottie.min.js"></script>
<script src="../agent_design_system/assets/symbol/code/web/agent-motion.js"></script>
</head>
<body>
<div class="chat">
  <div class="markdown" id="md"></div>
</div>

<script>
// 화면 스타일은 모두 lib/design-system.css의 정의 클래스입니다. 이 스크립트는 심볼 모션을 재생하고 턴을 순서대로 붙일 뿐입니다.
// 새로 고치면 처음부터 다시 재생됩니다.
(() => {
  const BASE = '../agent_design_system/assets/symbol/resources/motion/';
  const md = document.getElementById('md');
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const down = () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  const COPY = `<button type="button" class="act" data-act="copy" aria-label="복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>`;
  const AI_ACTIONS = `<div class="actions"><button type="button" class="act" data-act="copy" aria-label="복사"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button><button type="button" class="act" data-act="like" aria-label="좋아요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3zm0 0 4-8a2.2 2.2 0 0 1 3 2.4L13 9h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 17.6 21H7"/></svg></button><button type="button" class="act" data-act="dislike" aria-label="싫어요"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(180 12 12)"><path d="M7 10v11H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h3zm0 0 4-8a2.2 2.2 0 0 1 3 2.4L13 9h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 17.6 21H7"/></g></svg></button><button type="button" class="act" data-act="share" aria-label="공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button><button type="button" class="act" data-act="regenerate" aria-label="다시 생성"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button></div>`;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };

  const TURNS = [
    { q: '아이패드를 사려는데 뭘 사야 할지 모르겠어. 필기랑 영상 보는 게 주 용도야.', think: 2600, blocks: [
      '<p>필기와 영상 감상이 주 용도라면 <strong>iPad Air</strong>가 가장 균형이 좋습니다. 예산이 빠듯하면 기본 iPad로도 충분합니다.</p>',
      '<div class="tw"><table><thead><tr><th>모델</th><th>이런 분께</th></tr></thead><tbody><tr><td>iPad (기본)</td><td>가볍게 필기하고 영상을 보는 분, 예산이 우선인 분</td></tr><tr><td>iPad Air</td><td>필기와 영상을 오래, 가벼운 작업까지 하는 분</td></tr><tr><td>iPad Pro</td><td>영상 편집처럼 무거운 작업을 하는 분</td></tr><tr><td>iPad mini</td><td>휴대성이 우선이고 한 손으로 독서를 하는 분</td></tr></tbody></table></div>',
      '<h2>사기 전에 확인할 것</h2><ul><li><strong>애플 펜슬 호환</strong>: 모델마다 지원하는 세대가 달라 필수로 확인해야 합니다.</li><li><strong>저장 용량</strong>: 영상을 내려받아 본다면 용량이 빨리 찹니다.</li><li><strong>필름</strong>: 종이질감 필름은 필기감을 살리는 대신 화질이 다소 떨어집니다.</li><li><strong>가격</strong>: 변동이 있으니 공식 스토어와 교육 할인을 함께 확인하세요.</li></ul>',
      '<p>필기가 우선이라면 펜슬 호환부터 확인하는 것을 권합니다.</p>' ] },
    { q: '에어랑 프로는 뭐가 달라?', think: 1600, blocks: [
      '<p>가장 큰 차이는 <strong>화면</strong>과 <strong>성능 여유</strong>입니다.</p>',
      '<ul><li><strong>화면</strong>: 프로가 더 밝고 부드럽게 움직이는 화면을 씁니다.</li><li><strong>성능</strong>: 프로는 무거운 편집 작업에 여유가 있습니다.</li><li><strong>무게 · 가격</strong>: 에어가 더 가볍고 가격 부담이 적습니다.</li></ul>',
      '<div class="bw"><blockquote>필기와 영상 감상 위주라면 프로의 차이를 체감하기 어려울 수 있습니다.</blockquote></div>' ] }
  ];

  async function landing(){
    const l = el('div', 'landing', '<div class="symbol is-landing" role="img" aria-label="AI Agent"></div>');
    md.appendChild(l);
    const a = AgentMotion.play(l.firstChild, BASE + 'agent_signature/lottie/agent_signature.json', { loop: false });
    a.addEventListener('complete', () => setTimeout(() => a.goToAndPlay(0, true), 3000));
    await wait(6500);
    a.destroy(); l.remove();
  }

  async function turn(t, thread){
    thread.appendChild(el('div', 'msg user', '<div class="col"><div class="bubble"><p>' + t.q + '</p></div></div><div class="actions">' + COPY + '</div>'));
    const ai = el('div', 'msg ai');
    const content = el('div', 'content');
    const status = el('div', 'status', '<div class="symbol is-status" role="img" aria-label="생각하는 중"></div><span class="status-label">생각하는 중</span>');
    content.appendChild(status); ai.appendChild(content); thread.appendChild(ai);
    const flow = AgentMotion.state(status.firstChild, BASE); flow.think(); down();
    await wait(t.think);
    flow.work();                                           // 한 바퀴를 마친 뒤 생각 끝 → 작업 중
    status.lastChild.textContent = '생각 끝'; await wait(1200);
    status.lastChild.textContent = '작업하는 중'; status.classList.add('is-working');
    for (const b of t.blocks){
      const d = el('div', '', b);
      while (d.firstChild) content.appendChild(d.firstChild);
      down(); await wait(1500);
    }
    // 작업 완료: 심볼 · 시머 문구가 한 그룹으로 페이드(240ms) + 같은 시간에 완료 문구가 나타나며 왼쪽으로 이동 → `>`(접힘)
    const lb = status.lastChild, sy = status.firstChild;
    const sr = status.getBoundingClientRect(), lr = lb.getBoundingClientRect(), x = lr.left - sr.left;   // 시머 문구의 실제 위치
    const done = el('span', 'status-label is-complete-label', '작업 완료');
    done.style.left = x + 'px'; status.appendChild(done); void done.offsetWidth;
    const cr = sy.getBoundingClientRect(); lb.style.transformOrigin = (cr.left + cr.width / 2 - lr.left) + 'px 50%';
    sy.classList.add('is-fading'); lb.classList.add('is-fading'); done.classList.add('is-shown');
    done.style.transform = 'translateX(' + (-x) + 'px)'; await wait(260);
    flow.destroy(); sy.remove(); lb.remove(); done.className = 'status-label'; done.removeAttribute('style'); status.classList.remove('is-working'); status.classList.add('is-complete');   // 안착: 정적 완료 문구
    status.insertAdjacentHTML('beforeend', '<span class="status-chevron" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></span>');
    ai.appendChild(el('div', '', AI_ACTIONS).firstChild);                // 작업이 끝난 뒤에만 액션 줄 (UI-MSG-17)
  }

  (async () => {
    await landing();
    const thread = el('div', 'thread'); md.appendChild(thread);
    await turn(TURNS[0], thread); await wait(1800);
    await turn(TURNS[1], thread);
  })();
})();
</script>
</body>
</html>
