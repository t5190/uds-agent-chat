<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>채팅 미리보기</title>
<script src="lib/vendor/marked.min.js"></script>
<script src="lib/vendor/lottie.min.js"></script>
<script src="lib/spec-css.js"></script>
<script src="lib/chat-ui.js?v=2.3.1"></script>
<style>
  /* 렌더러 화면(크롬) 전용 스타일 — 채팅 스타일은 전부 agent_design_system/*.md 에서 생성됩니다 */
  :root{
    --ui-panel:#FFFFFF; --ui-bg:#F7F7F7; --ui-line:#E0E0E0; --ui-text:#1A1A1A;
    --ui-muted:#696969; --ui-accent:#E50675; --ui-surf:#F5F5F5;
  }
  html[data-theme="dark"]{
    --ui-panel:#1F1F1F; --ui-bg:#0A0A0A; --ui-line:#2E2E2E; --ui-text:#FAFAFA;
    --ui-muted:#A0A0A0; --ui-accent:#EE53A1; --ui-surf:#2A2A2A;
  }
  html[data-theme="dark"]{ color-scheme:dark; }
  *{ box-sizing:border-box; }
  html,body{ max-width:100%; overflow-x:clip; }   /* hidden이면 body가 스크롤 영역이 되어 sticky가 풀림 */
  body{ margin:0; background:var(--ui-bg); color:var(--ui-text);
    font-family:'Pretendard',system-ui,sans-serif; }
  /* 앱은 화면 높이에 맞춤: 상단 컨트롤은 고정이고 채팅 영역만 안에서 스크롤 */
  .app{ height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; padding:0; }
  .bar,.editor,.notice{ box-sizing:border-box; }
  /* 상단 컨트롤: 스크롤해도 맨 위에 고정 */
  .topbar{ position:relative; flex:none; z-index:100; padding:12px 20px 10px; border-bottom:1px solid var(--ui-line);
    background:var(--ui-bg); }   /* 불투명: 반투명이면 아래로 지나가는 회색 말풍선이 잘려 비침 */
  .bar{ max-width:960px; margin:0 auto; display:flex; align-items:center; gap:16px; }
  .scenes{ display:flex; align-items:center; gap:6px; flex:1; min-width:0; position:relative; }
  .case-btn{ flex:1; min-width:0; max-width:420px; height:32px; padding:0 12px; border:1px solid var(--ui-line); border-radius:8px; background:var(--ui-panel);
    color:var(--ui-text); font:inherit; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left; }
  .case-btn:hover{ border-color:var(--ui-muted); }
  .case-btn .idx{ flex:none; font-weight:500; color:var(--ui-muted); font-variant-numeric:tabular-nums; }
  .case-btn .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .case-btn svg{ flex:none; width:14px; height:14px; color:var(--ui-muted); }
  .case-menu{ position:absolute; top:calc(100% + 6px); left:0; z-index:200; width:min(420px,100%); max-height:min(60vh,480px); overflow-y:auto; padding:6px;
    background:var(--ui-panel); border:1px solid var(--ui-line); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; }
  .case-menu.on{ display:block; }
  .chip{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 10px; border:0; background:transparent; border-radius:8px; cursor:pointer;
    font:inherit; font-size:13px; line-height:18px; color:var(--ui-text); text-align:left; }
  .chip .idx{ flex:none; width:20px; color:var(--ui-muted); font-variant-numeric:tabular-nums; }
  .chip:hover,.chip.hl{ background:var(--ui-surf); }
  .chip.on{ font-weight:700; }
  .chip.on::after{ content:'✓'; margin-left:auto; color:var(--ui-accent); }
  .xwrap{ position:relative; }
  .xmenu{ position:absolute; top:calc(100% + 6px); right:0; z-index:300; min-width:210px; padding:6px; background:var(--ui-panel); border:1px solid var(--ui-line);
    border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); display:none; }
  .xmenu.on{ display:block; }
  .xmenu button{ display:flex; flex-direction:column; gap:1px; width:100%; padding:8px 10px; border:0; background:transparent; border-radius:8px; color:var(--ui-text); font:inherit; font-size:13px; text-align:left; cursor:pointer; }
  .xmenu button:hover{ background:var(--ui-surf); }
  .xmenu small{ font-size:11px; color:var(--ui-muted); }
  html.split #snips{ max-height:42vh; overflow-y:auto; margin-bottom:10px; }
  .grp{ padding:10px 10px 4px; font-size:11px; font-weight:600; color:var(--ui-muted); letter-spacing:.02em; }
  .grp:first-child{ padding-top:4px; }
  .chip.input{ border-top:1px solid var(--ui-line); border-radius:0 0 8px 8px; margin-top:4px; }
  .chip:focus-visible,.case-btn:focus-visible,.tbtn:focus-visible{ outline:2px solid var(--ui-accent); outline-offset:2px; }
  .tools{ display:flex; align-items:center; gap:6px; flex:none; padding-left:16px; border-left:1px solid var(--ui-line); }
  .tbtn{ height:32px; min-width:32px; padding:0 12px; border:1px solid var(--ui-line); border-radius:8px; background:var(--ui-panel);
    color:var(--ui-muted); cursor:pointer; font:inherit; font-size:12px; font-weight:500; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:color .12s, border-color .12s, background .12s; }
  .tbtn:hover{ color:var(--ui-text); border-color:var(--ui-muted); }
  .tbtn svg{ width:14px; height:14px; flex:none; }
  /* 바로 보기 스위치 */
  .tbtn.sw{ padding:0 12px 0 8px; }
  .tbtn.sw .track{ width:24px; height:14px; border-radius:7px; background:var(--ui-line); position:relative; flex:none; transition:background .15s; }
  .tbtn.sw .track::after{ content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:var(--ui-panel); transition:transform .15s; }
  .tbtn.sw[aria-checked="true"]{ color:var(--ui-text); }
  .tbtn.sw[aria-checked="true"] .track{ background:var(--ui-text); }
  .tbtn.sw[aria-checked="true"] .track::after{ transform:translateX(10px); background:var(--ui-bg); }
  #chat{ padding-top:32px; }
  .app > .chat{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; }
  .app > .editor,.app > .notice{ flex:none; width:calc(100% - 40px); }
  html.bare #chat{ padding-top:0; }
  .editor{ max-width:960px; margin:16px auto 16px; display:none; }
  .editor.on{ display:block; max-height:48vh; overflow-y:auto; }   /* 입력칸이 길어도 아래 채팅 화면이 보이게 */
  .editor textarea{ width:100%; height:150px; resize:vertical; border:1px solid var(--ui-line); border-radius:12px;
    background:var(--ui-panel); color:var(--ui-text); padding:14px 16px; outline:none;
    font-family:'Nanum Gothic Coding',monospace; font-size:12px; line-height:1.6; }
  .editor textarea:focus{ border-color:var(--ui-accent); }
  .editor .help{ font-size:12px; color:var(--ui-muted); margin:6px 2px 0; line-height:1.6; }
  .editor code{ font-family:'Nanum Gothic Coding',monospace; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 14px; }
  .panel-head h3{ margin:0; font-size:15px; }
  .panel-head select{ height:30px; max-width:200px; border:1px solid var(--ui-line); border-radius:8px; background:var(--ui-panel); color:var(--ui-text); font:inherit; font-size:12px; padding:0 8px; }
  .sec{ margin:0 0 12px; }
  .sec > b{ display:block; margin:0 0 6px; font-size:11px; font-weight:600; letter-spacing:.02em; color:var(--ui-muted); }
  .sec .grid{ display:flex; flex-wrap:wrap; gap:6px; }
  .snip{ height:28px; padding:0 11px; border:1px solid var(--ui-line); border-radius:8px; background:var(--ui-panel); color:var(--ui-text);
    font:inherit; font-size:12px; cursor:pointer; transition:border-color .12s, background .12s; }
  .snip:hover{ border-color:var(--ui-muted); background:var(--ui-surf); }
  .snip.user{ border-color:var(--ui-text); }
  .notice{ max-width:960px; margin:16px auto 16px; padding:14px 16px; border-radius:12px; font-size:13px; line-height:1.7;
    background:var(--ui-panel); border:1px solid var(--ui-line); display:none; }
  .notice.on{ display:block; }
  .notice code{ font-family:'Nanum Gothic Coding',monospace; background:var(--ui-surf); padding:2px 6px; border-radius:4px; }
  @media (max-width:767px){
    .topbar{ padding:10px 16px 8px; }
    .bar{ flex-wrap:wrap; gap:8px; }
    .scenes{ flex:1 1 100%; }
    .case-btn{ max-width:none; }
    .tools{ flex:1 1 100%; padding-left:0; border-left:0; overflow-x:auto; scrollbar-width:none; }
    .editor,.notice{ margin-left:20px; margin-right:20px; }
  }
  /* 첫 진입 화면만 있을 때: 심볼 · 인사말 · 입력창 묶음을 채팅 영역 세로 가운데에 둔다 (4-9) */
  .app > #chat:has(.thread > .msg:only-child > .landing){ display:flex; flex-direction:column; padding-top:0; }
  .app > #chat:has(.thread > .msg:only-child > .landing) > .markdown,
  .app > #chat:has(.thread > .msg:only-child > .landing) .thread,
  .app > #chat:has(.thread > .msg:only-child > .landing) .thread > .msg{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .app > #chat:has(.thread > .msg:only-child > .landing) .thread{ padding-top:0; padding-bottom:0; }   /* 첫 진입은 위 40 · 아래 60 간격 없이 영역 전체의 가운데 */
  .app > #chat:has(.thread > .msg:only-child > .landing) .landing{ flex:1; }
  /* 직접 입력: 왼쪽 컨트롤 패널 + 오른쪽 채팅 2단 (900px 미만은 위아래로 쌓음) */
  @media (min-width:900px){
    html.split .app{ display:grid; grid-template-columns:minmax(360px,440px) minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr); }
    html.split .app > .topbar,html.split .app > .notice{ grid-column:1 / -1; }
    html.split .app > .editor{ grid-column:1; grid-row:3; width:auto; max-width:none; max-height:none; margin:0; padding:16px 20px;
      overflow-y:auto; border-right:1px solid var(--ui-line); flex-direction:column; }
    html.split .app > .editor.on{ display:flex; }
    html.split .editor textarea{ flex:1 0 auto; height:auto; min-height:260px; }
    html.split .app > .chat{ grid-column:2; grid-row:3; }
  }
  /* 보기 모드 (?src=…) — 칩 · 편집기 없이 대화만 */
  html.bare .topbar,html.bare .editor{ display:none; }
  html.bare .app{ height:auto; display:block; overflow:visible; padding:40px 0; }
  html.bare .app > .chat{ overflow:visible; }
</style>
<style id="specBase"></style>
<style id="specRules"></style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="bar">
      <div class="scenes" id="scenes">
        <button class="tbtn" id="prevBtn" title="이전 케이스 (←)" aria-label="이전 케이스">‹</button>
        <button class="case-btn" id="caseBtn" aria-haspopup="listbox" aria-expanded="false"></button>
        <button class="tbtn" id="nextBtn" title="다음 케이스 (→)" aria-label="다음 케이스">›</button>
        <div class="case-menu" id="caseMenu" role="listbox" aria-label="케이스"></div>
      </div>
      <div class="tools">
        <button class="tbtn" id="replayBtn" title="처음부터 다시 재생"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5"/></svg><span>다시 재생</span></button>
        <button class="tbtn sw" id="instantBtn" role="switch" aria-checked="false" title="재생 없이 한 번에 보기"><span class="track"></span><span>바로 보기</span></button>
        <button class="tbtn" id="themeBtn" title="라이트/다크 전환" aria-label="라이트/다크 전환"></button>
        <button class="tbtn" id="reloadBtn" title="가이드 다시 불러오기">새로고침</button>
        <span class="xwrap"><button class="tbtn" id="exportBtn" aria-haspopup="menu" aria-expanded="false" title="지금 보이는 화면을 코드로 내보내기">내보내기</button>
          <div class="xmenu" id="exportMenu" role="menu">
            <button type="button" role="menuitem" data-x="save">HTML 파일 저장<small>파일 하나로 바로 열림</small></button>
            <button type="button" role="menuitem" data-x="copy">HTML 전체 복사<small>붙여넣어 바로 쓰기</small></button>
            <button type="button" role="menuitem" data-x="markup">마크업만 복사<small>내 CSS에 끼워 넣기</small></button>
          </div></span>
      </div>
    </div>
  </header>

  <div class="notice" id="notice">
    <b>서버에서 만든 화면으로만 볼 수 있습니다.</b> 이 폴더에서 <code>npm run dev</code>를 실행한 뒤 <code>http://127.0.0.1:8765/chat.html</code>을 여세요. <code>file://</code>로 연 페이지는 스펙(md)을 읽지 못해 그리지 않습니다.
  </div>

  <div class="editor" id="editor">
    <div class="panel-head"><h3>직접 입력</h3>
      <select id="loadCase" aria-label="케이스 불러오기"><option value="">케이스 불러오기</option></select></div>
    <div id="snips"></div>
    <textarea id="src" spellcheck="false" aria-label="대화 입력"></textarea>
  </div>

  <div class="chat" id="chat">
    <div class="markdown"><div class="thread" id="thread"></div></div>
  </div>
</div>

<script>
(() => {
  const SPEC = 'agent_design_system/';

  const $ = id => document.getElementById(id);
  const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
                  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

  let spec = null;                 // { tokens, rules, baseCss, examples }
  const params = new URLSearchParams(location.search);
  const viewSrc = /^[\w\-\/가-힣 .()]+\.md$/.test(params.get('src') || '') && !params.get('src').includes('..') ? params.get('src') : null;   // 보기 모드: 이 대화 파일만 그림
  let mode = (params.get('theme') || store.get('chat-theme')) === 'dark' ? 'dark' : 'light';
  let current = store.get('chat-scene') || '';

  // ---------- 파일 읽기 ----------
  async function readText(path){
    const r = await fetch(path, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status + ' ' + path);
    return r.text();
  }

  // ---------- 스펙 파싱 (lib/spec-css.js 공통) ----------
  async function loadSpec(){
    const { tokens, rules, baseCss } = await SpecCSS.load(p => readText(SPEC + p));
    const tpl = await readText(SPEC + '5-templates/5-2-examples.md');
    // 5-2의 표 순서가 목록 순서, `###` 제목이 묶음 이름
    const list = []; let group = '';
    for (const line of tpl.split('\n')){
      const h = line.match(/^###\s+(.+?)\s*$/); if (h){ group = h[1]; continue; }
      const m = line.match(/\]\((examples\/[^)#\s]+\.md)\)/);
      if (m && !list.some(x => x.path === m[1])) list.push({ path: m[1], group });
    }
    const examples = await Promise.all(list.map(async ({ path, group }) => {   // 파일을 한꺼번에 읽는다
      const raw = await readText(SPEC + '5-templates/' + path);
      return { id: path.replace(/^examples\/|\.md$/g, ''), group, raw, ...parseConversation(raw) };
    }));
    return { tokens, rules, baseCss, examples };
  }

  // ---------- CSS 생성 (lib/spec-css.js 공통) ----------
  function applyCSS(){
    if (!spec) return;
    const out = SpecCSS.css(spec, mode);
    $('specBase').textContent = out.base;
    $('specRules').textContent = out.rules;
    document.documentElement.setAttribute('data-theme', mode);
    $('themeBtn').textContent = mode === 'light' ? '다크' : '라이트';
  }

  // ---------- 대화 렌더링 (lib/chat-ui.js 공통 코어, 접두 없는 가이드 클래스명) ----------
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const CORE = { prefix: '' };
  const parseConversation = text => { const r = ChatUI.parseConversation(text); return Object.assign({}, r, { turns: r.messages }); };
  const renderMarkdown = md => ChatUI.renderMarkdown(md, CORE);
  // ---------- 재생: 실제 응답하듯 단계적으로 그린다 (생각 중 → 생각 끝 → 작업 중 + 글자가 이어짐 → 완료 뒤 액션 줄, UI-SYM-03~05 · UI-MSG-17) ----------
  let playToken = 0;
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // 움직임 줄이기가 켜져 있으면 재생 없이 바로 보임
  let instant = params.get('play') === '0' || store.get('chat-instant') === '1' || reduceMotion;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const HEAD = /^\s*\[(?:심볼|상태|완료)\s*:[^\]]*\][ \t]*\n?/;
  const DEF = /^\[출처\s+[^\]\s:]+\s*:.*\]\s*$/;

  // research: 작업 단계가 있는 턴은 생각 중부터 완료까지 `.is-research`(14px)로 통일해 중간에 글자 크기가 바뀌지 않게 한다
  function nodeOf(m, research){
    const t = document.createElement('template'); t.innerHTML = ChatUI.renderMessages([m], CORE).trim();
    const n = t.content.firstElementChild, st = research && n.querySelector('.status');
    if (st) st.classList.add('is-research');
    return n;
  }
  function addMsg(m, research){ const n = nodeOf(m, research); $('thread').appendChild(n); ChatUI.enhance($('chat'), CORE); return n; }
  // 같은 상태 줄은 그대로 두고 본문만 바꾼다(심볼 모션이 처음부터 다시 돌지 않게)
  function paintMsg(node, m, research){
    const fresh = nodeOf(m, research), oc = node.querySelector('.content'), nc = fresh.querySelector('.content');
    if (!oc || !nc){ node.innerHTML = fresh.innerHTML; ChatUI.enhance($('chat'), CORE); return; }
    const os = oc.querySelector('.status'), ns = nc.querySelector('.status');
    const same = !!(os && ns && os.className === ns.className && os.textContent === ns.textContent);
    [...oc.children].forEach(ch => { if (!(same && ch === os)) { ChatUI.stopMotions(ch); ch.remove(); } });
    [...nc.children].forEach(ch => { if (!(same && ch === ns)) oc.appendChild(ch); });
    const oa = node.querySelector('.actions'), na = fresh.querySelector('.actions');
    if (oa && !na) oa.remove(); else if (!oa && na) node.appendChild(na);
    ChatUI.enhance($('chat'), CORE);
  }
  // 재생 중 맨 아래를 따라간다. 사용자가 위로 스크롤하면 멈추고, 다시 맨 아래 가까이 오면 이어서 따라간다
  let stick = true;
  const userScroll = e => { if (e.type === 'touchmove' || e.deltaY < 0) stick = false; };
  window.addEventListener('wheel', userScroll, { passive:true }); window.addEventListener('touchmove', userScroll, { passive:true });
  function follow(){
    const bare = document.documentElement.classList.contains('bare');   // 보기 모드는 문서가 스크롤, 그 밖에는 채팅 영역이 스크롤
    const el = bare ? document.documentElement : $('chat'), top = bare ? window.scrollY : el.scrollTop, view = bare ? window.innerHeight : el.clientHeight;
    if (el.scrollHeight - top - view < 80) stick = true;
    if (stick) (bare ? window : el).scrollTo({ top: el.scrollHeight });
  }

  // 상태 줄 문구를 교체한다(사라짐 120ms + 나타남 120ms, 4-9). 심볼과 시머는 그대로 둔다
  async function swapLabel(node, text, cls){
    const st = node.querySelector('.status'), lb = st && st.querySelector('.status-label');
    if (!lb) return;
    lb.classList.add('is-swapping'); await sleep(120);
    lb.textContent = text; lb.classList.remove('is-swapping'); await sleep(120);
  }

  async function playAssistant(m, my){
    const raw = m.content || '';
    const lines = raw.split('\n');
    const defs = lines.filter(l => DEF.test(l)).join('\n');
    let body = lines.filter(l => !DEF.test(l)).join('\n');
    const head = (body.match(HEAD) || [''])[0];
    body = body.slice(head.length);
    if (/\[심볼\s*:\s*시그니처/.test(head) || !body.trim()){ addMsg(m); follow(); return; }   // 시그니처 · 심볼만 있는 턴은 바로 보임
    // 머리 줄: `[심볼: 작업 중 | 단계 → 단계]`(끝나도 진행 중) · `[완료: 완료 문구 | 단계 → 단계]`(작업 완료 + `>`) · `[상태: …]`(리서치 완료) · 없음(간단한 질문, UI-SYM-14)
    const hm = head.match(/\[(심볼|상태|완료)\s*:\s*([^\]|]*?)\s*(?:\|\s*([^\]]*?)\s*)?\]/);

    const working = () => `[심볼: 작업 중 | ${cur}]\n`;   // 재생 중에는 작업 문구를 같은 크기로 보임
    const node = addMsg({ role: 'assistant', content: '[심볼: 생각 중]', done: false }, worked);
    follow(); await sleep(1080); if (my !== playToken) return;   // 생각 중 한 바퀴(1.08초)
    if (worked){
      paintMsg(node, { role: 'assistant', content: '[심볼: 생각 끝]', done: false }, worked);
      await sleep(450); await swapLabel(node, cur); await sleep(1140 - 450 - 240); if (my !== playToken) return;   // 생각 끝 1.14초, 0.45초에 문구 교체
      paintMsg(node, { role: 'assistant', content: working(), done: false }, worked);
    } else {
      const quick = node.querySelector('.status'); if (quick){ ChatUI.stopMotions(quick); quick.remove(); }   // 간단한 질문: 페이드 없이 즉시 지움
    }
    const per = Math.max(3, Math.ceil(body.length / 150));   // 한 답변이 6초 안에 끝나도록 조각 크기를 키움
    for (let i = 0; i < body.length;){
      let j = Math.min(body.length, i + per + Math.floor(Math.random() * 3));
      while (j < body.length && !/\s/.test(body[j])) j++;   // 낱말 중간에서 끊지 않음
      const ob = body.lastIndexOf('[', j - 1), cb = ob >= 0 ? body.indexOf(']', ob) : -1;
      if (ob >= i - 1 && cb >= j) j = cb + 1;   // `[출처: …]` `[검색: …]` 같은 대괄호 줄은 닫힐 때까지 한 번에
      const paragraph = body.slice(i, j).includes('\n\n');
      i = j;
      const want = Math.min(steps.length - 1, Math.floor(i / body.length * steps.length));
      if (worked && want > stepIdx){ stepIdx = want; cur = steps[want]; await swapLabel(node, cur); if (my !== playToken) return; }   // 단계가 바뀌면 문구만 교체(UI-SYM-19)
      paintMsg(node, { role: 'assistant', content: (worked ? working() : '') + defs + '\n' + body.slice(0, i), done: false }, worked);
      follow();
      await sleep(paragraph ? 220 : 28 + Math.floor(Math.random() * 22)); if (my !== playToken) return;
    }
    const st = node.querySelector('.status');
    if (worked && !inProgress && st && kind === '완료'){
      // 작업 완료(Working 5): 0 ~ 240ms 동안 ① 심볼 · 시머 문구를 한 그룹으로 페이드(투명도 100 → 0%, 크기 100 → 92%, 모션은 계속 재생)
      // ② 같은 시간에 완료 문구가 시머 문구 자리에서 나타나며 심볼 자리(왼쪽 끝)로 이동(자르지 않음) ③ 안착 후 `>`(접힘)
      const lb = st.querySelector('.status-label'), sy = st.querySelector('.symbol');
      const sr = st.getBoundingClientRect(), lr = lb.getBoundingClientRect(), x = lr.left - sr.left;   // 시머 문구의 실제 화면 위치
      const done = document.createElement('span');
      done.className = 'status-label is-complete-label'; done.textContent = hm[2];
      done.style.left = x + 'px'; done.style.fontSize = getComputedStyle(lb).fontSize;
      st.appendChild(done); void done.offsetWidth;
      if (sy){ const cr = sy.getBoundingClientRect(); lb.style.transformOrigin = `${cr.left + cr.width / 2 - lr.left}px 50%`; sy.classList.add('is-fading'); }   // 크기 변화의 중심은 심볼 중앙
      lb.classList.add('is-fading'); done.classList.add('is-shown'); done.style.transform = `translateX(${-x}px)`;
      await sleep(260); if (my !== playToken) return;
      st.insertAdjacentHTML('beforeend', '<span class="status-chevron" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg></span>');
    }

  }

    });
    const motionScript = motions
      ? `<script>${lottieSrc.replace(/<\/script/gi, '<\\/script')}<\/script>\n<script>\n(function(){\nvar M={${names.map(n => `${JSON.stringify(n)}:${motions[n].replace(/</g, '\\u003c')}`).join(',')}};\n` +
        `document.querySelectorAll('[data-motion]').forEach(function(el){\nvar n=el.getAttribute('data-motion'),loop=n==='agent_thinking_loop'||n==='agent_working';\n` +
        `var a=lottie.loadAnimation({container:el,renderer:'svg',loop:loop,autoplay:true,animationData:JSON.parse(JSON.stringify(M[n]))});\n` +
        `if(n==='agent_thinking_end')a.addEventListener('complete',function(){setTimeout(function(){a.goToAndPlay(0,true)},3000)});\n});\n})();\n<\/script>\n`
      : '';
    thread.querySelectorAll('.composer-scrim,.scroll-bottom').forEach(el => el.remove());
    const css = ($('specBase').textContent + '\n' + $('specRules').textContent)
      .replace(/url\(['"]?(?:\.\.\/)*lib\/vendor\/fonts\/(Pretendard-[A-Za-z]+\.woff2)['"]?\)/g, `url('${PRETENDARD}$1')`)
      .replace(/@font-face\s*\{[^}]*lib\/vendor\/fonts\/(?!Pretendard)[^}]*\}/g, '');   // 코드 서체는 CDN이 없어 빼고 기본 고정폭 글꼴로 둔다
    const bg = mode === 'dark' ? '#0A0A0A' : '#F7F7F7', title = ($('caseBtn').querySelector('.name') || {}).textContent || '채팅';
    const body = `<div class="chat"><div class="markdown"><div class="thread">${thread.innerHTML}</div></div></div>`;
    const html = `<!DOCTYPE html>\n<html lang="ko" data-theme="${mode}">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>${esc(title)}</title>\n<style>\nbody{margin:0;background:${bg};}\n${css}\n</style>\n</head>\n<body>\n${body}\n${motionScript}</body>\n</html>\n`;
    return { html, markup: body, title };
  }
  async function runExport(kind){
    const { html, markup, title } = await exportDoc();
    if (kind === 'save'){
      const a = document.createElement('a'), safe = title.replace(/[^\w가-힣]+/g, '-').replace(/^-|-$/g, '') || 'chat';
      a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' })); a.download = `uds-chat-${safe}.html`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      return '저장했어요';
    }
    try { await navigator.clipboard.writeText(kind === 'copy' ? html : markup); return '복사했어요'; }
    catch(e){ return '복사하지 못했어요 (브라우저 권한)'; }
  }
  function toggleExport(on){ $('exportMenu').classList.toggle('on', on); $('exportBtn').setAttribute('aria-expanded', on); }

  async function boot(){
    if (location.protocol === 'file:' && !window.__EMBED){ $('notice').classList.add('on'); return; }   // 서버에서 만든 화면만 그린다(dist/chat.html은 md를 내장해 예외)
    try{
      spec = await loadSpec();
      $('notice').classList.remove('on');
    }catch(e){
      console.warn(e); $('notice').classList.add('on'); return;
    }
    applyCSS();
    if (viewSrc){
      const r = await fetch(viewSrc, { cache: 'no-store' });
      const conv = parseConversation(r.ok ? await r.text() : `@assistant\n대화 파일을 찾지 못했습니다: \`${viewSrc}\``);
      if (conv.title || conv.name) document.title = conv.title || conv.name;
      renderConversation(conv);
      return;
    }
    renderChips(); fillCaseSelect(); renderSnips(); show(current);
  }

  $('caseMenu').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) show(b.dataset.id); });
  $('caseBtn').addEventListener('click', () => toggleMenu());
  $('prevBtn').addEventListener('click', () => step(-1));
  $('nextBtn').addEventListener('click', () => step(1));
  document.addEventListener('click', e => { if (!e.target.closest('#scenes')) toggleMenu(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return toggleMenu(false);
    if (!spec || viewSrc || e.target.closest('textarea,input') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  $('themeBtn').addEventListener('click', () => { mode = mode === 'light' ? 'dark' : 'light'; store.set('chat-theme', mode); applyCSS(); });
  $('reloadBtn').addEventListener('click', boot);
  $('exportBtn').addEventListener('click', e => { e.stopPropagation(); toggleExport(!$('exportMenu').classList.contains('on')); });
  $('exportMenu').addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const label = b.firstChild.textContent, msg = await runExport(b.dataset.x);
    toggleExport(false); const t = $('exportBtn'), old = t.textContent; t.textContent = msg; setTimeout(() => { t.textContent = old; }, 1500); void label;
  });
  document.addEventListener('click', e => { if (!e.target.closest('.xwrap')) toggleExport(false); });
  $('editor').addEventListener('click', e => { const b = e.target.closest('.snip'); if (b) insertSnippet(b.dataset.snip); });
  $('loadCase').addEventListener('change', e => {
    const ex = spec && spec.examples.find(x => x.id === e.target.value); if (!ex) return;
    $('src').value = ex.raw.replace(/^---[\s\S]*?\n---\s*\n/, '').trim() + '\n';
    $('src').dispatchEvent(new Event('input')); e.target.value = '';
  });
  $('replayBtn').addEventListener('click', () => { const was = instant; instant = false; show(current); instant = was; });
  $('instantBtn').addEventListener('click', () => { instant = !instant; store.set('chat-instant', instant ? '1' : '0'); syncInstantBtn(); show(current); });
  syncInstantBtn();
  // 직접 입력: 타이핑이 멈추면(250ms) 한 번만 그린다. 쓰는 중에는 재생 연출 없이 바로 보인다
  let typing = 0;
  $('src').addEventListener('input', () => {
    clearTimeout(typing);
    typing = setTimeout(() => {
      store.set('chat-input', $('src').value);
      const was = instant; instant = true; renderConversation(parseConversation($('src').value)); instant = was;
    }, 250);
  });
  document.addEventListener('click', e => { const a = e.target.closest('#chat a'); if (a && a.getAttribute('href') === '#') e.preventDefault(); });

  if (viewSrc) document.documentElement.classList.add('bare');
  document.documentElement.setAttribute('data-theme', mode);
  $('themeBtn').textContent = mode === 'light' ? '다크' : '라이트';
  window.__chat = { parseConversation, renderMarkdown, applyCSS, get spec(){ return spec; } };
  boot();
})();
</script>
</body>
</html>
